<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fallen Sword Path Finder</title>
<script>try { if (localStorage.getItem('fspf_theme') === 'game') document.documentElement.dataset.theme = 'game'; } catch (e) { /* no storage */ }</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <div class="brand">
    <h1>Fallen Sword <span>Path Finder</span></h1>
    <p>Levels 1 &ndash; 6276 &middot; proof of concept</p>
  </div>

  <div class="tools">
    <div class="field ac">
      <label for="q">Find an area</label>
      <input id="q" type="search" placeholder="e.g. Ramdal, Dreg Swamp&hellip;  ( / )" autocomplete="off">
      <ul class="sugg" id="qSugg" hidden></ul>
    </div>

    <div class="route">
      <div class="field ac">
        <label for="rFrom">Route from</label>
        <input id="rFrom" type="text" placeholder="Start area" autocomplete="off">
        <ul class="sugg" id="rFromSugg" hidden></ul>
      </div>
      <button id="rSwap" type="button" title="Swap start and destination">&#8644;</button>
      <div class="field ac">
        <label for="rTo">to</label>
        <input id="rTo" type="text" placeholder="Destination" autocomplete="off">
        <ul class="sugg" id="rToSugg" hidden></ul>
      </div>
      <button id="rGo" type="button" class="primary">Find route</button>
      <button id="rClear" type="button" class="ghost" hidden>Clear</button>
    </div>
  </div>
  <button id="findBtn" type="button" class="ghost iconBtn" aria-expanded="false" aria-label="Find an area" title="Find an area"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
  <button id="routeBtn" type="button" class="ghost iconBtn" aria-expanded="false" aria-label="Find a route" title="Find a route between two areas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H14a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-7h5.5" stroke-dasharray="0"/></svg></button>
  <button id="themeBtn" type="button" class="ghost" title="Switch between the dark theme and the game's parchment theme">Theme</button>
</header>

<div id="shell">
<aside id="side" aria-label="Levels">
  <label id="goWrap">Go to level <input id="goLevel" type="number" min="1" placeholder="e.g. 2500"></label>
  <div id="tabs"></div>
</aside>
<div id="content">

<nav id="pageBar">
  <button id="levelsBtn" type="button" class="ghost" aria-expanded="false" aria-controls="side">&#9776; Levels</button>
  <div id="pageTitle"></div>
  <div id="worldStrip" aria-label="World map order"></div>
  <button id="creatureBtn" type="button" class="ghost" aria-expanded="false" title="Find realms by the creatures living there">Creatures</button>
  <button id="resetBtn" type="button" class="ghost" title="Put the boxes you moved back where they were">Reset layout</button>
  <button id="legendBtn"type="button" class="ghost" aria-expanded="false">Legend</button>
  <section id="creatures" hidden>
    <div class="crRow">
      <label>Race <select id="crRace"></select></label>
      <label>Creature name <input id="crName" type="search" placeholder="e.g. Ice" autocomplete="off"></label>
      <span id="crCount"></span>
    </div>
    <ol id="crList"></ol>
  </section>
  <section id="legend" hidden></section>
</nav>

<div id="routePanel" hidden></div>

<main id="mapWrap">
  <div id="map">
    <svg id="edges" aria-hidden="true"></svg>
    <div id="sections"></div>
  </div>
</main>

<footer id="foot"></footer>

</div>
</div>

<div id="sideScrim" hidden></div>
<div id="card" hidden></div>

<script src="data.js"></script>
<script src="vendor/elk.bundled.js"></script>
<script src="route.js"></script>
<script src="app.js"></script>
</body>
</html>
